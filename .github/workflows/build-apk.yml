name: Build Android APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build debug APK
        run: gradle --stacktrace --no-daemon :app:assembleDebug

      - name: Copy APK
        run: cp app/build/outputs/apk/debug/app-debug.apk FastingCoach-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FastingCoach-debug-apk
          path: FastingCoach-debug.apk
